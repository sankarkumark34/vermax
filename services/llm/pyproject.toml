[project]
name = "vermax-llm"
version = "1.0.0"
description = "Vermax LLM service: verdict explanations, announcement classification, business summaries (language tasks only)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
